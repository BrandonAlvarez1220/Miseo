# Local development stack: PostgreSQL + API + web.
#   cp .env.example .env && docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-miseo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-miseo}
      POSTGRES_DB: ${POSTGRES_DB:-miseo}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-miseo} -d ${POSTGRES_DB:-miseo}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-miseo}:${POSTGRES_PASSWORD:-miseo}@db:5432/${POSTGRES_DB:-miseo}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
